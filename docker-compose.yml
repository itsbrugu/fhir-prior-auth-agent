services:
  hapi-fhir:
    image: hapiproject/hapi:v7.2.0
    ports:
      - "8080:8080"
    environment:
      - hapi.fhir.default_encoding=json
      - hapi.fhir.fhir_version=R4
      - hapi.fhir.allow_external_references=true
      - hapi.fhir.narrative_enabled=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/fhir/metadata"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - FHIR_BASE_URL=http://hapi-fhir:8080/fhir
      - DB_PATH=/data/prior_auth.db
      - CHROMA_PATH=/data/chroma
    volumes:
      - ./backend/app:/app/app
      - ./backend/rules:/app/rules
      - ./frontend:/app/frontend
      - backend_data:/data
    depends_on:
      hapi-fhir:
        condition: service_healthy

volumes:
  backend_data:
