services:
  hapi-fhir:
    image: hapiproject/hapi:v7.2.0
    ports:
      - "8080:8080"
    environment:
      - hapi.fhir.default_encoding=json
      - hapi.fhir.fhir_version=R4
      - hapi.fhir.allow_external_references=true
      - hapi.fhir.narrative_enabled=true

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - FHIR_BASE_URL=http://hapi-fhir:8080/fhir
      - DB_PATH=/data/prior_auth.db
      - CHROMA_PATH=/data/chroma
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - ./backend/app:/app/app
      - ./backend/rules:/app/rules
      - ./frontend:/app/frontend
      - backend_data:/data
      - chroma_model_cache:/root/.cache
    depends_on:
      - hapi-fhir

volumes:
  backend_data:
  chroma_model_cache:
